name: Build MPC plugins

on:
  push:
    branches: [main, genra-chop]
  workflow_dispatch:

jobs:
  chop-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py fetches the zig cross compiler on first use (pip install ziglang into sdk/.sdk-tools)
      - name: Build CHOP TEST (native + arm32 + arm64, skins, validator)
        run: python sdk/tools/build.py "chop-test/CHOP TEST"

      - name: CHOP TEST - hand-made pages BROWSER, PADS, SETUP and validate again
        run: |
          python chop-test/tools/build_skin.py "chop-test/CHOP TEST"
          python sdk/tools/validate.py "chop-test/CHOP TEST"

      - name: Build CHOP LINK
        run: python sdk/tools/build.py "chop-test/CHOP LINK"

      - name: Host simulator tests
        run: |
          set -e
          native() { ls "$1"/build/native/*.so | head -n 1; }
          sdk/.sdk-tools/host_sim "$(native "chop-test/CHOP TEST")" test --seconds 3 --notes 36,38,41
          # CHOP LINK is silent on its own (it follows CHOP TEST): only crashes and NaNs count here
          sdk/.sdk-tools/host_sim "$(native "chop-test/CHOP LINK")" test --seconds 2

      - name: Put the plugin folders into "VST2 Plugins"
        run: |
          mkdir -p "dist/VST2 Plugins"
          cp -r "chop-test/CHOP TEST/build/Genra - VST - CHOP TEST" "dist/VST2 Plugins/"
          cp -r "chop-test/CHOP LINK/build/Genra - VST - CHOP LINK" "dist/VST2 Plugins/"
          find dist -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: genra-mpc-chop-test
          path: dist/

  genra-chop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build GENRA CHOP (native + arm32 + arm64)
        run: python sdk/tools/build.py "genra-chop/GENRA CHOP"

      - name: GENRA CHOP - pages BROWSER, CHOP, SETUP (images drawn by the script) and validate again
        run: |
          python genra-chop/tools/build_skin.py "genra-chop/GENRA CHOP"
          python sdk/tools/validate.py "genra-chop/GENRA CHOP"

      - name: Build GENRA BASS
        run: python sdk/tools/build.py "genra-chop/GENRA BASS"

      - name: Host simulator tests
        run: |
          set -e
          native() { ls "$1"/build/native/*.so | head -n 1; }
          sdk/.sdk-tools/host_sim "$(native "genra-chop/GENRA CHOP")" test --seconds 3 --notes 36,38,41
          sdk/.sdk-tools/host_sim "$(native "genra-chop/GENRA CHOP")" test --seconds 4 --playing --notes 36
          sdk/.sdk-tools/host_sim "$(native "genra-chop/GENRA BASS")" test --seconds 3 --notes 40,43

      - name: Put the plugin folders into "VST2 Plugins"
        run: |
          mkdir -p "dist/VST2 Plugins"
          cp -r "genra-chop/GENRA CHOP/build/Genra - VST - GENRA CHOP" "dist/VST2 Plugins/"
          cp -r "genra-chop/GENRA BASS/build/Genra - VST - GENRA BASS" "dist/VST2 Plugins/"
          find dist -type f | sort | head -n 80

      - uses: actions/upload-artifact@v4
        with:
          name: genra-mpc-genra-chop
          path: dist/
