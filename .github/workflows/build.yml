name: Build MPC plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

# CHOP TEST and CHOP LINK (chop-test/) stay in the repo as an archive and are no longer built.

jobs:
  genra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py fetches the zig cross compiler on first use (pip install ziglang into sdk/.sdk-tools)
      - name: Build GENRA CHOP and GENRA SCHLAG (native + arm32 + arm64)
        run: |
          set -e
          for p in "GENRA CHOP" "GENRA SCHLAG"; do
            python sdk/tools/build.py "genra-chop/$p"
          done

      - name: Pages (images drawn by the script) and validate again
        run: |
          set -e
          for p in "GENRA CHOP" "GENRA SCHLAG"; do
            python genra-chop/tools/build_skin.py "genra-chop/$p"
            python sdk/tools/validate.py "genra-chop/$p"
          done

      - name: Host simulator tests
        run: |
          set -e
          native() { ls "$1"/build/native/*.so | head -n 1; }
          sdk/.sdk-tools/host_sim "$(native "genra-chop/GENRA CHOP")" test --seconds 3 --notes 36,38,41
          sdk/.sdk-tools/host_sim "$(native "genra-chop/GENRA CHOP")" test --seconds 4 --playing --notes 36
          sdk/.sdk-tools/host_sim "$(native "genra-chop/GENRA SCHLAG")" test --seconds 3 --notes 36,37,38,39
          sdk/.sdk-tools/host_sim "$(native "genra-chop/GENRA SCHLAG")" test --seconds 4 --playing --notes 36

      - name: Put the plugin folders into "VST2 Plugins"
        run: |
          mkdir -p "dist/VST2 Plugins"
          for p in "GENRA CHOP" "GENRA SCHLAG"; do
            cp -r "genra-chop/$p/build/Genra - VST - $p" "dist/VST2 Plugins/"
          done
          find dist -type f | sort | head -n 120

      - uses: actions/upload-artifact@v4
        with:
          name: genra-mpc
          path: dist/
